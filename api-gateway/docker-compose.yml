version: '3.8'

services:
  # ==========================================
  # BASES DE DATOS
  # ==========================================
  
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: glucpred-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Event Bus
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: glucpred-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  # MySQL Database for Authentication Service
  auth-db:
    image: mysql:8.0
    container_name: glucpred-auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: glucpred_root_2024
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass_2024
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pglucpred_root_2024"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    command: --default-authentication-plugin=mysql_native_password

  # MySQL Database for Profile Service
  profile-db:
    image: mysql:8.0
    container_name: glucpred-profile-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: glucpred_root_2024
      MYSQL_DATABASE: profile_db
      MYSQL_USER: profile_user
      MYSQL_PASSWORD: profile_pass_2024
    ports:
      - "3308:3306"
    volumes:
      - profile_db_data:/var/lib/mysql
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pglucpred_root_2024"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    command: --default-authentication-plugin=mysql_native_password

  # ==========================================
  # MICROSERVICIOS
  # ==========================================
  
  # Authentication Service
  authentication-service:
    image: atahualpa365/authentication-service:latest
    container_name: glucpred-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      # Database Configuration
      DATABASE_URL: mysql+pymysql://auth_user:auth_pass_2024@auth-db:3306/auth_db?charset=utf8mb4
      # JWT Configuration
      JWT_SECRET_KEY: glucpred-jwt-secret-key-2024-change-in-production
      JWT_EXPIRATION_HOURS: 24
      # Flask Configuration
      SECRET_KEY: glucpred-flask-secret-key-2024
      DEBUG: "False"
      SQLALCHEMY_ECHO: "False"
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Profile Service
  profile-service:
    image: atahualpa365/profile-service:latest
    container_name: glucpred-profile-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      # Database Configuration
      DATABASE_URL: mysql+pymysql://profile_user:profile_pass_2024@profile-db:3306/profile_db?charset=utf8mb4
      # JWT Configuration (debe coincidir con auth-service)
      JWT_SECRET_KEY: glucpred-jwt-secret-key-2024-change-in-production
      JWT_EXPIRATION_HOURS: 24
      # Flask Configuration
      SECRET_KEY: glucpred-flask-secret-key-2024
      DEBUG: "False"
      SQLALCHEMY_ECHO: "False"
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      profile-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/profile/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # API GATEWAY (con Swagger)
  # ==========================================
  
  api-gateway:
    image: atahualpa365/api-gateway:latest
    container_name: glucpred-api-gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Service URLs
      AUTH_SERVICE_URL: http://authentication-service:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      # Request Configuration
      REQUEST_TIMEOUT: 30
      # Flask Configuration
      SECRET_KEY: glucpred-gateway-secret-key-2024
      DEBUG: "False"
    depends_on:
      authentication-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - glucpred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ==========================================
# NETWORKS & VOLUMES
# ==========================================

networks:
  glucpred-network:
    name: glucpred-network
    driver: bridge

volumes:
  auth_db_data:
    name: glucpred_auth_db_data
  profile_db_data:
    name: glucpred_profile_db_data
